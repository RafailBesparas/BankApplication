<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Transactions - BesparasBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/transactions.css" />
    <script defer src="/js/transactions.js"></script>
</head>
<body>

<header>
    <div class="logo h4">BesparasBank</div>
    <div class="nav-links">
        <a href="/account-summary">Account Summary</a>
        <a href="/transactions">Transactions</a>
        <a href="/loan/apply">Apply for Loan</a>
        <a href="/loan/status">Loan Status</a>
        <a href="/notification">🔔 Notifications</a>
        <a href="/profile">Profile</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
</header>

<main class="container mt-5 pt-4">
    <h2 class="mb-4">Transaction History</h2>

    <form method="get" class="filter-form mb-3">
        <input type="datetime-local" name="from" th:value="${param.from}" placeholder="From Date">
        <input type="datetime-local" name="to" th:value="${param.to}" placeholder="To Date">
        <input type="number" name="min" step="0.01" th:value="${param.min}" placeholder="Min Amount">
        <input type="number" name="max" step="0.01" th:value="${param.max}" placeholder="Max Amount">
        <select name="type" th:value="${param.type}">
            <option value="">All Types</option>
            <option value="DEPOSIT">Deposit</option>
            <option value="WITHDRAWAL">Withdrawal</option>
            <option value="Transfer In">Transfer In</option>
            <option value="Transfer Out">Transfer Out</option>
        </select>
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="/transactions" class="btn btn-secondary">Reset</a>
    </form>

    <div class="table-wrapper">
        <table class="table table-striped table-bordered">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="transaction : ${transactions}">
                <td th:text="${transaction.id}"></td>
                <td th:text="${transaction.type}"></td>
                <td th:text="${transaction.amount}"
                    th:classappend="${transaction.type.contains('Transfer In') or transaction.type == 'DEPOSIT'} ? 'text-success' : 'text-danger'"></td>
                <td th:text="${#temporals.format(transaction.timestamp, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${transaction.message}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-outline-secondary">&larr; Back to Dashboard</a>
    </div>
</main>

<footer class="mt-5">
    &copy; 2025 BesparasBank. All rights reserved.
</footer>

</body>
</html>
