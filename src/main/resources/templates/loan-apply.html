<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loan-apply.css}" />
    <title>Apply for a Loan</title>
</head>
<body>

<header>
    <div class="logo h4">BesparasBank</div>
    <div class="nav-links">
        <a href="/account-summary">Account Summary</a>
        <a href="/transactions">Transactions</a>
        <a href="/loan/apply">Apply for Loan</a>
        <a href="/loan/status">Loan Status</a>
        <a href="/notification">🔔 Notifications</a>
        <a href="/profile">Profile</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
</header>

<div class="container">
    <h2>Loan Application</h2>
    <form th:action="@{/loan/apply}" method="post" enctype="multipart/form-data">
        <label>Full Name</label>
        <input type="text" name="fullName" required />

        <label>Date of Birth</label>
        <input type="date" name="dateOfBirth" required />

        <label>Nationality</label>
        <input type="text" name="nationality" required />

        <label>Address</label>
        <input type="text" name="address" required />

        <label>Marital Status</label>
        <input type="text" name="maritalStatus" required />

        <label>Number of Dependents</label>
        <input type="number" name="numberOfDependents" required />

        <label>Employment Status</label>
        <input type="text" name="employmentStatus" required />

        <label>Employer Name</label>
        <input type="text" name="employerName" required />

        <label>Employment Duration (months)</label>
        <input type="number" name="employmentDurationMonths" required />

        <label>Monthly Net Income (€)</label>
        <input type="number" name="monthlyNetIncome" step="0.01" required />

        <label>Other Monthly Income (€)</label>
        <input type="number" name="otherIncome" step="0.01" required />

        <label>Monthly Rent or Mortgage (€)</label>
        <input type="number" name="monthlyRentOrMortgage" step="0.01" required />

        <label>Do you have existing loans?</label>
        <select name="hasExistingLoans">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>

        <label>Loan Amount (€)</label>
        <input type="number" name="amount" step="0.01" required />

        <label>Purpose of Loan</label>
        <input type="text" name="purpose" required />

        <label>Term Duration (months)</label>
        <input type="number" name="termMonths" required />

        <label>Upload Supporting Documents</label>
        <input type="file" name="document" accept="application/pdf,image/*" />

        <button type="submit">Submit Application</button>
    </form>
</div>

<footer class="mt-5">
    &copy; 2025 BesparasBank. All rights reserved.
</footer>

</body>
</html>
