<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <meta charset="UTF-8" />
    <title>Notification Center</title>
    <link rel="stylesheet" href="/css/notification-style.css" />
</head>
<body>

<header>
    <div class="logo h4">BesparasBank</div>
    <div class="nav-links">
        <a href="/account-summary">Account Summary</a>
        <a href="/transactions">Transactions</a>
        <a href="/loan/apply">Apply for Loan</a>
        <a href="/loan/status">Loan Status</a>
        <a href="/notification">🔔 Notifications</a>
        <a href="/profile">Profile</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
</header>



<div class="container">

    <div class="filters">
        <button onclick="filterType('ALL')">All</button>
        <button onclick="filterType('TRANSACTION')">Transaction</button>
        <button onclick="filterType('ACCOUNT')">Account</button>
        <button onclick="filterType('SECURITY')">Security</button>
    </div>

    <div id="notifications" class="notification-list">
        <!-- Notifications will be dynamically inserted here -->
    </div>
</div>

<script src="/js/notification-script.js"></script>



<footer class="mt-5">

</footer>
