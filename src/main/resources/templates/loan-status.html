<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <title>Loan Status</title>
    <link rel="stylesheet" th:href="@{/css/loan-status.css}" />
</head>
<body>

<header>
    <div class="logo h4">BesparasBank</div>
    <div class="nav-links">
        <a href="/account-summary">Account Summary</a>
        <a href="/transactions">Transactions</a>
        <a href="/loan/apply">Apply for Loan</a>
        <a href="/loan/status">Loan Status</a>
        <a href="/notification">🔔 Notifications</a>
        <a href="/profile">Profile</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
</header>



<div class="container">
    <h2>Your Loan Applications</h2>
    <table>
        <thead>
        <tr>
            <th>Amount</th>
            <th>Term</th>
            <th>Status</th>
            <th>Applied On</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${loans}">
            <td th:text="${loan.amount}"></td>
            <td th:text="${loan.termMonths}"></td>
            <td th:text="${loan.status}"></td>
            <td th:text="${loan.applicationDate}"></td>
            <td><a th:href="@{'/loan/detail/' + ${loan.loanId}}">View</a></td>
        </tr>
        </tbody>
    </table>
</div>



<footer class="mt-5">
    &copy; 2025 BesparasBank. All rights reserved.
</footer>

</body>
</html>
